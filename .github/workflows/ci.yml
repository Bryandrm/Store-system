name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: there is no value in finishing a run for
# a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # A real Postgres, matching production. The test harness creates and drops
      # a database per test, so it needs a role that can CREATE DATABASE.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: store_migrator
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: postgres
          # Same initialization as production, so a collation or checksum
          # difference cannot hide here and appear on deploy.
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8 --data-checksums"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U store_migrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -race is not optional in a system with a sync engine.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://store_migrator:ci_only@localhost:5433/postgres?sslmode=disable
        # -p 1 serializes package binaries. They share one Postgres, and
        # Postgres has cluster-wide state: an open transaction in one package
        # pins xmin and starves another package's sync feed. See gotcha #8.
        run: go test ./... -race -p 1

      # The cross-table invariants that no CHECK can express, run against a
      # freshly migrated database.
      #
      # On an empty schema they hold trivially, so this is a smoke test that the
      # binary and its queries actually run. The checks themselves are proven in
      # internal/verify/verify_test.go, which corrupts data on purpose and
      # asserts each one fires — a checker that never fires is not verified.
      - name: Verify invariants
        env:
          PGURL: postgres://store_migrator:ci_only@localhost:5433/store_verify?sslmode=disable
          ADMIN_URL: postgres://store_migrator:ci_only@localhost:5433/postgres?sslmode=disable
        run: |
          psql "$ADMIN_URL" -c "CREATE DATABASE store_verify"
          MIGRATION_DATABASE_URL="$PGURL" go run ./cmd/storeapi -migrate-only
          DATABASE_URL="$PGURL" go run ./cmd/verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Reads testdata/money_cases.json, the same file the Go suite reads. If
      # the two ever stop sharing it, one of these suites goes red.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: store_migrator
          POSTGRES_PASSWORD: dev_only_no_usar_en_produccion
          POSTGRES_DB: store_system
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8 --data-checksums"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U store_migrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web

      # The specs connect as store_app, the same role production uses, so the
      # grants are genuinely exercised rather than bypassed by a superuser.
      # The migration creates that role NOLOGIN on purpose — no secret lives in
      # the repository — so it needs credentials assigned here.
      - name: Prepare the database
        env:
          PGURL: postgres://store_migrator:dev_only_no_usar_en_produccion@localhost:5433/store_system?sslmode=disable
        run: |
          MIGRATION_DATABASE_URL="$PGURL" go run ./cmd/storeapi -migrate-only
          psql "$PGURL" -c "ALTER ROLE store_app LOGIN PASSWORD 'dev_app'"

      - name: Run Playwright
        run: pnpm exec playwright test
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged by commit as well as latest, so a deploy can be pinned and
          # a rollback is a tag change rather than a rebuild.
          tags: |
            ghcr.io/${{ github.repository_owner }}/store-system:latest
            ghcr.io/${{ github.repository_owner }}/store-system:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
